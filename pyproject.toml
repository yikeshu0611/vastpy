[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vastpy"
version = "0.6.36"
description = "Drive the Vast large-file viewer from Python (localhost JSON API)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZhangJing", email = "zj391120@163.com" }]
dependencies = [
  "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vastpy*"]
